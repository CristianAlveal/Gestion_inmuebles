
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casas en Arriendo</title>

     <script src="https://kit.fontawesome.com/22ae6d249f.js" crossorigin="anonymous"></script>
{% load static %}
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
 

<body>

    <div class="container-fluid">
      
        <!-- Navbar --> {% include 'layout/navbar.html' %}
         <br>
        <!-- header --> {% include 'layout/header.html' %}

      {% if messages %}
    <div class="container mt-3">

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
                 role="alert">

                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar">
                </button>

            </div>

        {% endfor %}

    </div>
{% endif %}
        
        <br>

                         <main class="container">

            {% block content %}

            {% endblock %}

        </main>

         <!-- caracteristica --> {% include 'layout/caracteristicas.html' %}

        <br>
        <!-- Footer --> {% include 'layout/footer.html' %}
    
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>

</body>
</html>
